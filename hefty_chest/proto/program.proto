syntax = "proto3";

package heft.v1;

import "google/protobuf/timestamp.proto";
import "common.proto";
import "workout.proto";

// ProgramService handles training programs.
//
// A Program is a time-bounded block (start_date + duration_weeks) made up of
// one or more workouts. Each workout is assigned a set of weekdays on which
// it runs. Weekdays without an assigned workout are rest days.
service ProgramService {
  // List all programs for a user
  rpc ListPrograms(ListProgramsRequest) returns (ListProgramsResponse);

  // Get a single program with full details
  rpc GetProgram(GetProgramRequest) returns (GetProgramResponse);

  // Create a new program
  rpc CreateProgram(CreateProgramRequest) returns (CreateProgramResponse);

  // Update a program
  rpc UpdateProgram(UpdateProgramRequest) returns (UpdateProgramResponse);

  // Delete a program
  rpc DeleteProgram(DeleteProgramRequest) returns (DeleteProgramResponse);

  // Set a program as active (deactivates others)
  rpc SetActiveProgram(SetActiveProgramRequest) returns (SetActiveProgramResponse);

  // Get today's workouts based on active program
  rpc GetTodayWorkout(GetTodayWorkoutRequest) returns (GetTodayWorkoutResponse);
}

// Program summary (list view)
message ProgramSummary {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string description = 4;
  string start_date = 5; // YYYY-MM-DD
  int32 duration_weeks = 6;
  int32 total_workouts = 7;
  bool is_active = 8;
  bool is_archived = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// Program with full details
message Program {
  string id = 1;
  string user_id = 2;
  string name = 3;
  string description = 4;
  string start_date = 5; // YYYY-MM-DD
  int32 duration_weeks = 6;
  bool is_active = 7;
  bool is_archived = 8;
  repeated ProgramWorkout workouts = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

// A workout scheduled within a program on one or more weekdays
message ProgramWorkout {
  string id = 1;
  string program_id = 2;
  string workout_template_id = 3;
  string workout_name = 4; // denormalized for list rendering
  repeated DayOfWeek days_of_week = 5;
  int32 display_order = 6;
}

// Input for creating/updating a program workout
message ProgramWorkoutInput {
  string workout_template_id = 1;
  repeated DayOfWeek days_of_week = 2;
  int32 display_order = 3;
}

// ListPrograms
message ListProgramsRequest {
  optional bool include_archived = 1;
  PaginationRequest pagination = 2;
}

message ListProgramsResponse {
  repeated ProgramSummary programs = 1;
  PaginationResponse pagination = 2;
}

// GetProgram
message GetProgramRequest {
  string id = 1;
}

message GetProgramResponse {
  Program program = 1;
}

// CreateProgram
message CreateProgramRequest {
  string name = 1;
  optional string description = 2;
  string start_date = 3; // YYYY-MM-DD
  int32 duration_weeks = 4;
  repeated ProgramWorkoutInput workouts = 5;
}

message CreateProgramResponse {
  Program program = 1;
}

// UpdateProgram
message UpdateProgramRequest {
  string id = 1;
  optional string name = 2;
  optional string description = 3;
  optional string start_date = 4; // YYYY-MM-DD
  optional int32 duration_weeks = 5;
  optional bool is_archived = 6;
  // If true, replaces the program's workouts list atomically using `workouts`.
  bool replace_workouts = 7;
  repeated ProgramWorkoutInput workouts = 8;
}

message UpdateProgramResponse {
  Program program = 1;
}

// DeleteProgram
message DeleteProgramRequest {
  string id = 1;
}

message DeleteProgramResponse {
  bool success = 1;
}

// SetActiveProgram
message SetActiveProgramRequest {
  string id = 1;
}

message SetActiveProgramResponse {
  Program program = 1;
}

// GetTodayWorkout
message GetTodayWorkoutRequest {}

message GetTodayWorkoutResponse {
  string date = 1;
  DayOfWeek day_of_week = 2;
  bool in_program_window = 3;
  repeated Workout workouts = 4;
  Program program = 5;
}
