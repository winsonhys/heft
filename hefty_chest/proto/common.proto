syntax = "proto3";

package heft.v1;

import "google/protobuf/timestamp.proto";

// Pagination request parameters
message PaginationRequest {
  int32 page = 1;
  int32 page_size = 2;
}

// Pagination response metadata
message PaginationResponse {
  int32 page = 1;
  int32 page_size = 2;
  int32 total_count = 3;
  int32 total_pages = 4;
}

// Exercise type enum matching database
enum ExerciseType {
  EXERCISE_TYPE_UNSPECIFIED = 0;
  EXERCISE_TYPE_WEIGHT_REPS = 1;
  EXERCISE_TYPE_BODYWEIGHT_REPS = 2;
  EXERCISE_TYPE_TIME = 3;
  EXERCISE_TYPE_DISTANCE = 4;
  EXERCISE_TYPE_CARDIO = 5;
}

// Workout session status
enum WorkoutStatus {
  WORKOUT_STATUS_UNSPECIFIED = 0;
  WORKOUT_STATUS_IN_PROGRESS = 1;
  WORKOUT_STATUS_COMPLETED = 2;
  WORKOUT_STATUS_ABANDONED = 3;
}

// Day of week. ISO ordering: Monday=1..Sunday=7.
enum DayOfWeek {
  DAY_OF_WEEK_UNSPECIFIED = 0;
  DAY_OF_WEEK_MONDAY = 1;
  DAY_OF_WEEK_TUESDAY = 2;
  DAY_OF_WEEK_WEDNESDAY = 3;
  DAY_OF_WEEK_THURSDAY = 4;
  DAY_OF_WEEK_FRIDAY = 5;
  DAY_OF_WEEK_SATURDAY = 6;
  DAY_OF_WEEK_SUNDAY = 7;
}

// Section item type
enum SectionItemType {
  SECTION_ITEM_TYPE_UNSPECIFIED = 0;
  SECTION_ITEM_TYPE_EXERCISE = 1;
  SECTION_ITEM_TYPE_REST = 2;
}
